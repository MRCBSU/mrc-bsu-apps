# Republishes the index app to shinyapps.io whenever the app changes on main
# (for example, when a pull request adding a new app is merged).
# The shinyapps.io token is stored as an encrypted secret; nobody sees it.
name: Deploy app index

on:
  push:
    branches: [main]
    paths:
      - "index-app/**"
  workflow_dispatch: # lets you rerun a deployment by hand from the Actions tab

permissions:
  contents: read

# Never run two deployments at once.
concurrency:
  group: deploy-app-index
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: shinyapps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate app list
        run: python validate_index.py index-app/apps.json --no-url-check

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # prebuilt packages, much faster installs
          r-version: '4.5.2' #jammy (shinyapps.io's ubuntu variant) doesnt always support latest

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c("rsconnect", "shiny", "bslib", "thematic", "jsonlite"))

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ vars.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_APP_NAME: ${{ vars.SHINYAPPS_APP_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        shell: Rscript {0}
        run: |
          account <- Sys.getenv("SHINYAPPS_ACCOUNT")
          rsconnect::setAccountInfo(
            name   = account,
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir = "index-app",
            appName = Sys.getenv("SHINYAPPS_APP_NAME"),
            account = account,
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
